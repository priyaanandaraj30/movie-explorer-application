<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Search and browse movies, see ratings and details.">
  <title>Movie Explorer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip" href="#view">Skip to content</a>
  <header class="top">
    <div class="wrap bar">
      <a class="logo" href="#/">Movie<span>Explorer</span></a>
      <form id="search-form" role="search" novalidate>
        <label for="q" class="sr-only">Search movies</label>
        <input id="q" type="search" placeholder="Search movies, e.g. orbit" autocomplete="off" maxlength="80">
        <button type="submit">Search</button>
      </form>
      <nav><a href="#/" id="nav-home">Browse</a><a href="#/watchlist" id="nav-watch">Watchlist <b id="watch-count">0</b></a></nav>
    </div>
    <p id="message" class="wrap" role="alert" hidden></p>
  </header>
  <main id="view" class="wrap" tabindex="-1" aria-live="polite"></main>
  <footer class="wrap foot">Movie data from <a href="https://www.themoviedb.org/">TMDB</a> when an API key is set in <code>js/config.js</code>; otherwise sample data is shown. This product uses the TMDB API but is not endorsed or certified by TMDB.</footer>
  <script src="js/config.js"></script>
  <script src="js/sample-data.js"></script>
  <script src="js/api.js"></script>
  <script src="js/components.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
